# M4 自研方法。LoRA 旁路加基座输出上的 KL 正则，方案见 PLAN/04-M4方案.md。
#
# 底座与 M2 逐项相同，两法只差正则项一处，故读数之差可直接归给该项。
# kl_weight 由 P3 的开发集扫描定，置 null 时装配即报错，不使未定取值静默跑完。

method: custom

train:
  lr: 1.0e-4
  epochs: 3

custom:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  kl_weight: 1.6          # 五档扫描后定于 1.6，依据见 PLAN/04-M4方案.md 第五节
  kl_chunk: 128           # 散度沿序列维的分块宽度
